name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual triggering

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('**/deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Verify Deno installation
        shell: bash
        run: |
          deno --version
          echo "Deno installed successfully"

      - name: Check deno.json syntax
        shell: bash
        run: deno task --help

      - name: Type check
        shell: bash
        run: |
          echo "Running type check..."
          deno task check
          echo "Type check passed"

      - name: Lint
        shell: bash
        run: |
          echo "Running linter..."
          deno lint
          echo "Lint check passed"

      - name: Format check
        shell: bash
        run: |
          echo "Running format check..."
          deno fmt --check
          echo "Format check passed"

      - name: Run tests
        shell: bash
        run: |
          echo "Running tests..."
          deno task test
          echo "Tests passed"

      - name: Test installation (dry run)
        shell: bash
        run: |
          echo "Testing installation script (dry run)..."
          deno run --allow-all scripts/install-safely.ts --help
          echo "Installation script help works"
